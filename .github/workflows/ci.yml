name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v4

      - name: Lint
        run: |
          for f in $(find src tests -name '*.php'); do php -l "$f" > /dev/null; done

      - name: Coding standards
        run: vendor/bin/phpcs

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Unit tests
        run: vendor/bin/phpunit --no-coverage

  integration:
    runs-on: ubuntu-latest
    name: WordPress integration
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: 'composer:v2', coverage: none }

      - uses: ramsey/composer-install@v4

      - name: Boot stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      - name: Wire wp-config and mu-plugin
        run: |
          docker compose -f docker-compose.test.yml exec -T wp bash -c '
            until [ -f /var/www/html/wp-settings.php ]; do sleep 2; done
            grep -q anvil-config /var/www/html/wp-config.php || \
              printf "\nrequire_once \x27/harness/anvil-config.php\x27;\n" >> /var/www/html/wp-config.php
            mkdir -p /var/www/html/wp-content/mu-plugins
            cp /mu-plugin/anvil-media-gcs.php /var/www/html/wp-content/mu-plugins/'

      - name: Clean install + migration scenarios
        run: docker compose -f docker-compose.test.yml exec -T wp bash /harness/run.sh

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail=100
